title: What Return to Yahweh
lang: en
category: Presentation of Gifts
source: Catholic Unite

body:
  - type: verse
    number: 1
    lines:
      - What return to Yahweh can I make
      - What return to Yahweh can I make
      - For blessings of every kind from Him that I have received

  - type: chorus
    lines:
      - What return to Yahweh, what returns can I make
      - What return to Yahweh, what returns can I make
      - What return to Yahweh
      - For blessings of every kind from Him that I have received

  - type: verse
    number: 3
    lines:
      - He created me the Lord
      - And He annointed me the Lord
      - For blessings of every kind from Him that I have received

  - type: verse
    number: 4
    lines:
      - He purifies me and strengthens me
      - By the Spirit, the Spirit of power
      - For blessings of every kind from Him that I have received