title: Bear Good Fruit
lang: en

body:
  - type: verse
    number: 1
    lines:
      - Bear good fruit, bear those fruits
      - Bear fruit that is blessed, bear fruit of happiness

  - type: chorus
    lines:
      - When the Lord receives them, they will be fully blessed
      - Bear good fruit, bear fruit of happiness

  - type: verse
    number: 2
    lines:
      - Purify your conduct, purify your deeds
      - Purify with the Lord Jesus, purify everything

  - type: verse
    number: 3
    lines:
      - Work together as brothers, work with diligence
      - Work with the Lord Jesus, work with all you have

  - type: verse
    number: 4
    lines:
      - Offer your deeds together with your heart
      - And the Lord your God will bless you

  - type: verse
    number: 5
    lines:
      - The blessings of God the Father, the blessings of God the Son
      - And of the Holy Spirit be with you all