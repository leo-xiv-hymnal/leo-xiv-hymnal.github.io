title: O God, Lord
lang: en

body:
  - type: verse
    number: 1
    lines:
      - O God, Lord, accept these gifts
      - Offered to you by the priest at the altar
      - Make them become the Body of the Saviour
      - And His Blood too, a beautiful offering

  - type: verse
    number: 2
    lines:
      - Look upon this offering and have mercy on us through it
      - And on those being cleansed of sins in the fire
      - Do not look upon our sins now
      - As we are pleaded for by Jesus at the altar